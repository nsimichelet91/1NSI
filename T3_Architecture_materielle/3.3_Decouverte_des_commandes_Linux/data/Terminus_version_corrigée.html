<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminus — version corrigée</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050805; --panel: #0b120b; --line: #1f3a1f; --fg: #c9f5c9; --dim: #6f9a6f;
    --green: #22b14c; --dir: #6fd3ff; --item: #ffd75f; --people: #ff8fd8; --err: #ff6b6b; --learn: #9dff6b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
  body { font-family: 'VT323', ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace; font-size: 22px; line-height: 1.22; display: flex; flex-direction: column; }
  header { display: flex; align-items: baseline; gap: 14px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: #070c07; }
  header h1 { margin: 0; font-size: 34px; letter-spacing: 6px; color: var(--green); font-weight: normal; }
  header .sub { color: var(--dim); font-size: 18px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header button { font: inherit; font-size: 18px; background: none; color: var(--dim); border: 1px solid var(--line); padding: 2px 10px; cursor: pointer; }
  header button:hover { color: var(--fg); border-color: var(--green); }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(260px, 400px) 1fr; }
  #scene { border-right: 1px solid var(--line); padding: 16px; display: flex; flex-direction: column; gap: 10px; background: var(--panel); overflow: auto; }
  #frame { position: relative; width: 100%; aspect-ratio: 416 / 404; background: #000; }
  #frame img { image-rendering: pixelated; }
  #room { width: 100%; height: 100%; object-fit: contain; display: block; }
  #sprite { position: absolute; right: 4%; bottom: 4%; max-width: 46%; max-height: 52%; opacity: 0; transition: opacity .25s; filter: drop-shadow(0 0 6px #000) drop-shadow(0 0 2px #000); }
  #sprite.on { opacity: 1; }
  #place { font-size: 26px; color: var(--green); }
  #path { color: var(--dim); font-size: 18px; word-break: break-all; }
  #legend { margin-top: auto; font-size: 17px; color: var(--dim); border-top: 1px dashed var(--line); padding-top: 8px; }
  #legend span { margin-right: 10px; }
  #term { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  #out { flex: 1; overflow-y: auto; overflow-wrap: anywhere; padding: 14px 18px 6px; white-space: pre-wrap; word-wrap: break-word; }
  #out div { margin: 0 0 2px; }
  .cmd { color: #fff; margin-top: 10px !important; }
  .cmd .ps { color: var(--green); }
  .story { color: var(--fg); }
  .speech { color: #e8ffe8; }
  .info { color: #a7e3ff; }
  .label { color: var(--dim); }
  .dir { color: var(--dir); }
  .item { color: var(--item); }
  .people { color: var(--people); }
  .err { color: var(--err); }
  .warn { color: var(--item); }
  .dim { color: var(--dim); }
  .learn { color: var(--learn); }
  .help { color: var(--fg); }
  .man { color: #d8f8d8; border-left: 2px solid var(--line); padding-left: 10px; }
  .grep { color: var(--item); }
  .choice { color: var(--item); }
  .prompt { color: var(--item); }
  .code { color: #fff; font-size: 1.5em; letter-spacing: 3px; user-select: all; }
  .title { color: var(--green); }
  .big { font-size: 1.6em; letter-spacing: 4px; }
  #inrow { display: flex; align-items: center; gap: 8px; padding: 8px 18px 12px; border-top: 1px solid var(--line); background: #070c07; }
  #ps { color: var(--green); white-space: nowrap; flex: none; }
  #in { flex: 1; min-width: 0; font: inherit; color: #fff; background: transparent; border: none; outline: none; caret-color: var(--green); }
  #keys { display: none; gap: 6px; padding: 0 12px 10px; background: #070c07; }
  #keys button { flex: 1; font: inherit; font-size: 19px; padding: 6px 0; background: #0e1a0e; color: var(--fg); border: 1px solid var(--line); border-radius: 4px; }
  #end { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; z-index: 5; }
  #end.on { display: flex; }
  #end .box { background: var(--panel); border: 2px solid var(--green); padding: 18px; max-width: 420px; width: 92%; text-align: center; }
  #end img { width: 70%; image-rendering: pixelated; }
  #end button { font: inherit; margin-top: 10px; background: var(--green); color: #000; border: none; padding: 6px 16px; cursor: pointer; }
  @media (max-width: 760px) {
    body { font-size: 19px; }
    header h1 { font-size: 26px; letter-spacing: 3px; }
    header .sub { display: none; }
    main { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
    #scene { border-right: none; border-bottom: 1px solid var(--line); flex-direction: row; align-items: center; padding: 8px 12px; }
    #frame { width: 96px; flex: none; }
    #legend { display: none; }
    #out { padding: 10px 12px 4px; }
    #inrow { padding: 8px 12px 10px; }
    #keys { display: flex; }
    .big { font-size: 1.3em; letter-spacing: 2px; }
  }
</style>
</head>
<body>
<header>
  <h1>TERMINUS</h1>
  <div class="sub">Un jeu d'aventure pour apprendre la ligne de commande — version corrigée</div>
  <button id="btnSave" type="button" title="Obtenir un code de sauvegarde">sauver</button>
  <button id="btnHelp" type="button" title="Afficher l'aide">help</button>
</header>
<main>
  <section id="scene">
    <div id="frame"><img id="room" alt=""><img id="sprite" alt=""></div>
    <div>
      <div id="place">Départ</div>
      <div id="path">/home/Départ</div>
    </div>
    <div id="legend"><span class="dir">■ chemins</span><span class="item">■ objets</span><span class="people">■ personnes</span><br>Tab : compléter · ↑ ↓ : historique</div>
  </section>
  <section id="term">
    <div id="out" aria-live="polite"></div>
    <form id="inrow" autocomplete="off">
      <span id="ps"></span>
      <input id="in" type="text" spellcheck="false" autocapitalize="off" autocorrect="off" aria-label="Commande">
    </form>
    <div id="keys"><button type="button" data-k="tab">Tab ⇥</button><button type="button" data-k="up">↑</button><button type="button" data-k="down">↓</button><button type="button" data-k="ls">ls</button></div>
  </section>
</main>
<div id="end"><div class="box"><img id="endimg" alt="Fin"><div>Tu as terminé Terminus !</div><button type="button" id="endclose">Continuer à explorer</button></div></div>

'use strict';

const ALL_CMDS = ['ls', 'cd', 'pwd', 'cat', 'less', 'help', 'man', 'clear', 'exit', 'whoami',
  'mv', 'touch', 'cp', 'unzip', 'rm', 'mkdir', 'grep', 'sudo', 'history', 'reset', 'sauver', 'charger', 'mode'];
const HIDDEN_CMDS = ['mode'];
const B32 = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';

class GNode {
  constructor (kind, name, opt = {}) {
    this.kind = kind; // room | item | people | link
    this.name = name;
    this.children = [];
    this.parent = null;
    this.hidden = false;
    Object.assign(this, opt);
  }
  add (...nodes) { for (const n of nodes) { n.parent = this; this.children.push(n) } return this }
  remove (n) { this.children = this.children.filter(c => c !== n); n.parent = null }
  get isDir () { return this.kind === 'room' || this.kind === 'link' }
  visible () { return this.children.filter(c => !c.hidden) }
  child (name) { return this.children.find(c => !c.hidden && c.name === name) }
  path () {
    if (!this.parent) return '/';
    const parts = []; let n = this;
    while (n.parent) { parts.unshift(n.name); n = n.parent }
    return '/' + parts.join('/');
  }
  isInside (anc) { let n = this; while (n) { if (n === anc) return true; n = n.parent } return false }
  getText (g) { return typeof this.text === 'function' ? this.text(g, this) : (this.text || '') }
}

function norm (s) { return s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase() }

function globToRe (g) {
  return new RegExp('^' + g.replace(/[.+^${}()|\\]/g, '\\$&').replace(/\*/g, '.*').replace(/\?/g, '.') + '$');
}

function tokenize (line) {
  // découpe en mots, gère les guillemets simples/doubles, et '|'
  const segs = [[]]; let cur = null; let q = null; let quoted = false;
  const push = () => { if (cur !== null) { segs[segs.length - 1].push({ v: cur, q: quoted }); cur = null; quoted = false } };
  for (const ch of line) {
    if (q) { if (ch === q) q = null; else cur += ch; continue }
    if (ch === '"' || ch === "'") { q = ch; if (cur === null) cur = ''; quoted = true; continue }
    if (ch === ' ' || ch === '\t') { push(); continue }
    if (ch === '|') { push(); segs.push([]); continue }
    if (cur === null) cur = '';
    cur += ch;
  }
  if (q) return { error: 'Guillemet non fermé.' };
  push();
  return { segs };
}

class Game {
  constructor (buildWorld, ui = {}) {
    this.buildWorld = buildWorld;
    this.ui = ui; // { image(key), sprite(key), clear(), end() }
    this.reset();
  }

  reset () {
    this.buf = [];
    this.flags = {};
    this.learned = new Set(['ls', 'cd', 'pwd', 'cat', 'less', 'help', 'clear', 'exit', 'history', 'reset', 'sauver', 'charger', 'mode']);
    this.hard = false;
    this.hist = [];
    this.pending = null; // { type:'password'|'choice', ... }
    this.cmdCount = 0;
    this.quests = {};
    this.world = this.buildWorld(this);
    this.root = this.world.root;
    this.home = this.world.home;
    this._rooms = null; this.staticRooms();
    this.cwd = this.home;
    this.prevDir = this.home;
    this.user = 'sure';
    this.password = this.world.password;
    this.isRoot = false;
  }

  // ---------- sortie ----------
  out (t, cls) { if (t === undefined || t === null || t === '') return; this.buf.push({ t: String(t), cls }) }
  err (t) { this.out(t, 'err') }
  info (t) { this.out(t, 'info') }
  story (t) { this.out(t, 'story') }
  flush () { const b = this.buf; this.buf = []; return b }
  image (k) { if (this.ui.image) this.ui.image(k) }
  sprite (k) { if (this.ui.sprite) this.ui.sprite(k) }

  learn (cmd, silent) {
    if (this.learned.has(cmd)) return;
    this.learned.add(cmd);
    if (!silent) this.out(`✦ Tu as appris un nouveau sort : « ${cmd} ». Tape « man ${cmd} » pour en savoir plus.`, 'learn');
  }

  quest (k) { this.quests[k] = true }

  prompt () {
    const p = this.cwd.path();
    const hp = this.home.path();
    const shown = p === hp ? '~' : p.startsWith(hp + '/') ? '~' + p.slice(hp.length) : p;
    return `${this.user}@terminus:${shown}$`;
  }

  // ---------- chemins ----------
  // retourne { node, parent, name, error }
  resolve (path, opts = {}) {
    if (path === undefined || path === '') return { node: this.cwd };
    let node; let parts;
    if (path === '~' || path.startsWith('~/')) { node = this.home; parts = path.slice(1).split('/') } else if (path.startsWith('/')) { node = this.root; parts = path.split('/') } else { node = this.cwd; parts = path.split('/') }
    parts = parts.filter(p => p !== '' && p !== '.');
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      const last = i === parts.length - 1;
      if (node.kind === 'link') node = node.target;
      if (!node.isDir) return { error: 'notdir', name: p };
      if (p === '..') { node = node.parent || node; continue }
      const c = node.child(p);
      if (!c) {
        if (last) return { node: null, parent: node, name: p };
        return { error: 'nopath', name: p, parent: node };
      }
      if (!last && c.kind === 'room' && this.blockedPass(c)) return { error: 'blocked', blocked: c, name: p };
      node = c;
    }
    if (opts.follow !== false && node.kind === 'link') node = node.target;
    return { node, parent: node.parent, name: node.name };
  }

  // un chemin intermédiaire est-il franchissable ? (cd à travers)
  blockedPass (room) {
    if (room.kind === 'link') room = room.target;
    if (room.gate && !room.gate(this)) return true;
    return !room.passThrough && !!this.enterBlock(room);
  }

  enterBlock (room) {
    if (room.kind === 'link') room = room.target;
    if (room.gate && !room.gate(this)) return room.gateMsg || 'Cet endroit est inaccessible.';
    if (room.cdBlock) { const m = typeof room.cdBlock === 'function' ? room.cdBlock(this, room) : room.cdBlock; if (m) return m }
    return null;
  }

  suggestion (parent, name) {
    if (this.hard) return '';
    if (!parent || !parent.isDir) return '';
    const dir = parent.kind === 'link' ? parent.target : parent;
    const n = norm(name);
    const hit = dir.visible().find(c => norm(c.name) === n || norm(c.name) === n.replace(/\/$/, ''));
    if (hit) return `\nVoulais-tu dire « ${hit.name} » ? Attention aux majuscules et aux accents : la touche Tab complète les noms pour toi.`;
    return '';
  }

  notFound (r, path, what) {
    if (r.error === 'blocked') return this.err(this.enterBlock(r.blocked));
    const base = r.parent && r.parent.kind === 'link' ? r.parent.target : r.parent;
    const msg = what === 'dir' ? `Il n'existe aucun chemin appelé « ${path} ».` : `L'objet « ${path} » n'existe pas ici.`;
    this.err(msg + this.suggestion(base, r.name || path));
  }

  expandGlobs (args) {
    const res = [];
    for (const a of args) {
      if (!a.q && /[*?]/.test(a.v)) {
        const i = a.v.lastIndexOf('/');
        const dirPath = i >= 0 ? a.v.slice(0, i) || '/' : '';
        const pat = i >= 0 ? a.v.slice(i + 1) : a.v;
        const r = dirPath ? this.resolve(dirPath) : { node: this.cwd };
        if (r.node && r.node.isDir) {
          const re = globToRe(pat);
          const m = r.node.visible().filter(c => re.test(c.name)).map(c => (i >= 0 ? a.v.slice(0, i + 1) : '') + c.name).sort();
          if (m.length) { res.push(...m); continue }
        }
      }
      res.push(a.v);
    }
    return res;
  }

  // ---------- entrée ----------
  input (line) {
    if (this.pending) {
      const p = this.pending; this.pending = null;
      if (p.type === 'password') return this.finishSudo(p, line);
      if (p.type === 'choice') {
        const n = parseInt(line.trim(), 10);
        if (n >= 1 && n <= p.options.length) { p.cb(n - 1); return this.flush() }
        this.out('(Tu passes ton chemin.)', 'dim');
        if (line.trim() === '') return this.flush();
      }
      if (p.type === 'confirm') { p.cb(/^(o|oui|y|yes)$/i.test(line.trim())); return this.flush() }
    }
    const raw = line.trim();
    if (!raw) return this.flush();
    this.hist.push(raw);
    this.cmdCount++;
    this.run(raw, false);
    return this.flush();
  }

  run (raw, asRoot) {
    const tk = tokenize(raw);
    if (tk.error) return this.err(tk.error);
    const segs = tk.segs.filter(s => s.length);
    if (tk.segs.length > 1 && segs.length !== tk.segs.length) return this.err('Il manque une commande autour du « | ».');
    let stdin = null;
    for (let i = 0; i < segs.length; i++) {
      const cap = i < segs.length - 1;
      const res = this.exec(segs[i], stdin, cap, asRoot);
      if (res && res.pending) return; // sudo en attente
      stdin = cap ? (res && res.stdout ? res.stdout : []) : null;
    }
  }

  // exécute une commande ; si cap, renvoie {stdout:[lignes]} au lieu d'afficher
  exec (seg, stdin, cap, asRoot) {
    const name = seg[0].v;
    const args = this.expandGlobs(seg.slice(1));
    if (!ALL_CMDS.includes(name)) {
      const hint = this.psy(name);
      this.err(`La commande « ${name} » est introuvable.` + (hint ? `\n${hint}` : ''));
      return;
    }
    if (!this.learned.has(name)) {
      if (name === 'whoami' && this.learned.has('sudo')) { /* ok */ } else { this.err("Tu n'as pas encore appris cette commande."); return }
    }
    const lines = [];
    const prevRoot = this.isRoot;
    this.isRoot = !!asRoot;
    const ctx = { stdin, cap, emit: (t, cls) => cap ? lines.push(...String(t).split('\n')) : this.out(t, cls) };
    try {
      const r = this['cmd_' + name](args, ctx, seg);
      if (r && r.pending) return r;
    } finally { this.isRoot = prevRoot }
    return { stdout: lines };
  }

  psy (name) {
    if (this.hard) return 'Tape « help » pour voir la liste de tes sorts.';
    const table = [
      [/^(detrui|remov|del|suppr|efface)/i, 'rm'], [/^(depl|déplac|boug|move|met)/i, 'mv'],
      [/^(perd|lost|ou$|où|lieu)/i, 'pwd'], [/^(regard|voir|liste|dir$)/i, 'ls'], [/^(lire|lis$|read|parl|examin|type$)/i, 'less'],
      [/^(aller|va$|vas$|go$|entr)/i, 'cd'], [/^(aide|help|\?)/i, 'help'], [/^(cherch|find|search)/i, 'grep'],
      [/^(copi|dupli)/i, 'cp'], [/^(cre|cré|fabri|touche)/i, 'touch'], [/^(cls)$/i, 'clear'], [/^(quit|bye)/i, 'exit']
    ];
    for (const [re, c] of table) if (re.test(name)) return this.learned.has(c) ? `Tu voulais peut-être utiliser « ${c} » ?` : '';
    if (/^[A-ZÀ-Ü]/.test(name)) return 'Pour examiner quelque chose ou parler à quelqu’un, écris « less ' + name + ' ».';
    return 'Tape « help » pour voir la liste de tes sorts.';
  }

  // ---------- commandes ----------
  cmd_help (args, c) {
    const H = this.world.help;
    c.emit('Tu peux utiliser les sorts suivants :', 'info');
    const list = [...this.learned].filter(k => !['reset', 'history', 'mode'].includes(k));
    const order = ALL_CMDS.filter(k => list.includes(k));
    for (const k of order) c.emit(`  ${k.padEnd(7)} ${H[k] || ''}`, 'help');
    c.emit("Pour les détails d'un sort : man NOM_DU_SORT. Pour recommencer la partie : reset.", 'dim');
  }

  cmd_man (args, c) {
    if (!args.length) return this.err("Il faut poser une question pour obtenir une réponse. C'est ce que dit le grand manuscrit.\nExemple : man ls");
    const k = args[0];
    const M = this.world.man;
    if (!M[k] || (!this.learned.has(k) && k !== 'man')) return this.err(`Il n'y a rien d'écrit dans le grand manuscrit à propos de « ${k} »` + (M[k] ? ' — du moins rien que tu puisses déjà lire.' : '.'));
    c.emit(M[k], 'man');
  }

  cmd_clear () { if (this.ui.clear) this.ui.clear(); this.buf = [] }
  cmd_exit (a, c) { c.emit("Au revoir ! (Pour de faux : un terminal ne se quitte pas si facilement. Continue l'aventure !)", 'info') }
  cmd_whoami (a, c) { c.emit(this.isRoot ? 'root' : this.user) }
  cmd_history (a, c) { this.hist.forEach((h, i) => c.emit(`${String(i + 1).padStart(4)}  ${h}`)) }
  cmd_reset () {
    this.pending = { type: 'confirm', cb: (ok) => { if (ok) { if (this.ui.restart) this.ui.restart() } else this.out('Ouf. La partie continue.', 'dim') } };
    this.out('Recommencer la partie depuis le début ? Toute ta progression sera effacée. (oui / non)', 'warn');
    return { pending: true };
  }

  cmd_pwd (a, c) { c.emit(this.cwd.path()) }

  describeRoom (room) {
    let t = room.getText(this);
    return t;
  }

  cmd_cd (args, c) {
    if (args.length > 1) return this.err("À moins de te dédoubler, tu ne peux pas aller dans plusieurs endroits en même temps.");
    let target = args[0];
    if (target === undefined || target === '~') target = '~';
    if (target === '-') { target = this.prevDir.path() }
    const r = this.resolve(target);
    if (r.error === 'notdir') return this.err(`« ${target} » n'est pas un chemin : c'est un objet. Pour l'examiner : less ${target}`);
    if (r.error || !r.node) return this.notFound(r, target, 'dir');
    const dest = r.node;
    if (!dest.isDir) return this.err(`« ${target} » n'est pas un chemin : c'est ${dest.kind === 'people' ? 'une personne' : 'un objet'}. Pour l'examiner : less ${dest.name}`);
    const block = this.enterBlock(dest);
    if (block) return this.err(block);
    const from = this.cwd;
    if (dest === this.cwd) { c.emit(`Tu es déjà dans ${dest.name || '/'}.`, 'dim'); return }
    if (dest.onEnterCheck) { const m = dest.onEnterCheck(this, dest); if (m) return this.err(m) }
    this.prevDir = from;
    this.cwd = dest;
    for (const fn of this.world.leaveHooks) fn(this, from, dest);
    const goingUp = from.isInside(dest) && from !== dest;
    if (dest === this.home && target.startsWith('~')) c.emit('Tu es de retour au point de départ !', 'info');
    else c.emit((goingUp ? 'Tu te trouves dans ' : 'Tu entres dans ') + (dest.name || 'la Racine') + '.', 'info');
    if (dest.onEnter) dest.onEnter(this, dest, from);
    c.emit(this.describeRoom(dest), 'story');
    this.image(dest.img);
    if (!this.hard && !this.flags.firstLsHint && dest !== this.home) { this.flags.firstLsHint = true; c.emit('(Écris « ls » pour voir ce qui se trouve ici.)', 'dim') }
  }

  cmd_ls (args, c) {
    const paths = args.filter(a => !a.startsWith('-'));
    if (!paths.length) paths.push('');
    for (const p of paths) {
      const r = this.resolve(p);
      if (r.error || !r.node) { this.notFound(r, p, 'dir'); continue }
      const n = r.node;
      if (!n.isDir) { c.emit(n.name); continue }
      if (paths.length > 1) c.emit(p + ' :', 'dim');
      if (n.gate && !n.gate(this)) { this.err(n.gateMsg || 'Cet endroit est inaccessible.'); continue }
      if (n.lsBlock) { const m = typeof n.lsBlock === 'function' ? n.lsBlock(this, n) : n.lsBlock; if (m) { this.err(m); continue } }
      if (n.lsText) { c.emit(typeof n.lsText === 'function' ? n.lsText(this, n) : n.lsText, 'story') }
      const ch = n.visible();
      const dirs = ch.filter(x => x.isDir); const items = ch.filter(x => x.kind === 'item'); const ppl = ch.filter(x => x.kind === 'people');
      if (!ch.length) { c.emit('Cette pièce est vide. Il n’y a rien.', 'dim'); continue }
      if (c.cap) { ch.forEach(x => c.emit(x.name)); continue }
      if (dirs.length) { c.emit('Là où tu peux aller (chemins) :', 'label'); c.emit('  ' + dirs.map(d => d.name + (d.kind === 'link' ? '@' : '/')).join('   '), 'dir') }
      if (items.length) { c.emit('Ici, tu peux interagir avec (objets) :', 'label'); c.emit('  ' + items.map(d => d.name).join('   '), 'item') }
      if (ppl.length) { c.emit('Ici, tu peux parler avec :', 'label'); c.emit('  ' + ppl.map(d => d.name).join('   '), 'people') }
    }
  }

  cmd_cat (a, c, s) { return this.cmd_less(a, c, s) }
  cmd_less (args, c, seg) {
    const cmdn = seg[0].v;
    if (!args.length) {
      if (c.stdin) { c.stdin.forEach(l => c.emit(l)); return }
      return this.err(`Pour que ça fonctionne, ${cmdn} doit être suivi d'un sujet à examiner : un objet ou une personne présente à l'endroit où tu te trouves.\nExemple : ${cmdn} ${this.cwd.visible().find(x => !x.isDir)?.name || 'Objet'}`);
    }
    for (const a of args) {
      const r = this.resolve(a);
      if (r.error || !r.node) { this.notFound(r, a, 'item'); continue }
      const n = r.node;
      if (n.isDir) { this.err(`« ${a} » est un chemin, pas un objet. Pour y aller : cd ${a}   Pour voir ce qu'il contient : ls ${a}`); continue }
      if (n.protected && !this.isRoot) { this.err('(Permission non accordée)'); if (n.protectedMsg) c.emit(typeof n.protectedMsg === 'function' ? n.protectedMsg(this, n) : n.protectedMsg, 'story'); continue }
      if (n.img) this.sprite(n.img);
      let text = n.getText(this);
      if (n.lessView && !c.cap) text = n.lessView(this, n);
      if (n.onLessBefore) { const t = n.onLessBefore(this, n, c); if (typeof t === 'string') text = t }
      c.emit(text, n.kind === 'people' ? 'speech' : 'story');
      if (n.onLess) n.onLess(this, n, c);
    }
  }

  // supprime/déplace : vérifications communes
  getItem (path) {
    const r = this.resolve(path, { follow: false });
    if (r.error || !r.node) { this.notFound(r, path, 'item'); return null }
    return r.node;
  }

  writable (room) {
    if (room.kind === 'link') room = room.target;
    if (this.isRoot) return true;
    if (room.writable === false) return false;
    return true;
  }

  cmd_mv (args, c) {
    if (args.length < 2) return this.err("Il faut un objet et un emplacement de destination pour réaliser un déplacement.\nIl faut écrire : mv OBJET LIEU_DE_DESTINATION");
    if (args.length > 2) return this.err("Un seul objet à la fois, s'il te plaît : mv OBJET LIEU_DE_DESTINATION");
    const [src, dst] = args;
    const it = this.getItem(src); if (!it) return;
    if (it.isDir) return this.err('Déplacer un chemin entier ? Ce sort est bien trop puissant pour toi.');
    if (it.onMvTry) { const m = it.onMvTry(this, it); if (m) return this.story(m) }
    if (it.fixed && !(this.isRoot && it.rootMovable)) return this.err(typeof it.fixed === 'string' ? it.fixed : 'Ceci ne peut être déplacé.');
    const r = this.resolve(dst);
    let destRoom; let newName = it.name;
    if (r.node && r.node.isDir) destRoom = r.node;
    else if (r.node && !r.node.isDir) { if (r.node === it) return this.err('Il est déjà là.'); destRoom = r.node.parent; newName = r.node.name }
    else if (!r.error && r.parent) { destRoom = r.parent.kind === 'link' ? r.parent.target : r.parent; newName = r.name }
    else return this.notFound(r, dst, 'dir');
    if (destRoom.mvBlock) { const m = destRoom.mvBlock(this, it); if (m) return this.err(m) }
    if (!this.writable(destRoom)) return this.err('Impossible de mettre ça dans cette pièce. (Permission non accordée)');
    const fromRoom = it.parent;
    if (!this.writable(fromRoom)) return this.err('Impossible de déplacer cet objet hors de cette pièce. (Permission non accordée)');
    const existing = destRoom.child(newName);
    if (existing && existing !== it) { if (existing.kind === 'people' || existing.fixed) return this.err(`« ${newName} » existe déjà et ne peut pas être écrasé.`); destRoom.remove(existing); this.info(`${it.name} remplace et écrase ${newName}.`) }
    fromRoom.remove(it);
    const oldName = it.name; it.name = newName; destRoom.add(it);
    if (destRoom === fromRoom) c.emit(`${oldName} s'appelle maintenant ${newName}.`, 'info');
    else c.emit(`${oldName} se trouve maintenant dans ${destRoom.name || '/'}${newName !== oldName ? ' sous le nom ' + newName : ''}.`, 'info');
    if (it.onMv) it.onMv(this, it, fromRoom, destRoom);
    for (const fn of this.world.events) fn(this, 'mv', it, destRoom);
  }

  cmd_cp (args, c) {
    if (args.length !== 2) return this.err('Il faut écrire : cp OBJET NOUVEAU_NOM');
    const [src, dst] = args;
    const it = this.getItem(src); if (!it) return;
    if (it.isDir) return this.err('Copier un chemin entier ? Ce sort est bien trop puissant pour toi.');
    if (it.onCpTry) { const m = it.onCpTry(this, it); if (m) return this.story(m) }
    if (it.kind === 'people') return this.err('On ne copie pas les gens. Imagine un peu le chaos…');
    const r = this.resolve(dst);
    let destRoom; let newName = it.name;
    if (r.node && r.node.isDir) destRoom = r.node;
    else if (r.node) return this.err(`« ${r.node.name} » existe déjà.`);
    else if (!r.error && r.parent) { destRoom = r.parent.kind === 'link' ? r.parent.target : r.parent; newName = r.name }
    else return this.notFound(r, dst, 'dir');
    if (destRoom.child(newName)) return this.err(`« ${newName} » existe déjà.`);
    if (!this.writable(destRoom)) return this.err('Impossible de mettre ça dans cette pièce. (Permission non accordée)');
    const cp = new GNode('item', newName, { text: it.copyText || it.text, img: it.img, copyOf: it.baseName || it.name, baseName: it.baseName || it.name, grepText: it.grepText });
    destRoom.add(cp);
    c.emit(`Les données de ${it.name} ont été dupliquées dans ${newName}.`, 'info');
    if (it.onCp) it.onCp(this, it, cp, destRoom);
    for (const fn of this.world.events) fn(this, 'cp', cp, destRoom);
  }

  cmd_rm (args, c) {
    if (!args.length) return this.err('Il faut écrire : rm OBJET');
    for (const a of args) {
      const it = this.getItem(a); if (!it) continue;
      if (it.isDir) { this.err("Supprimer un chemin entier ? Ce sort n'en a pas le pouvoir."); continue }
      if (it.onRmTry) { const m = it.onRmTry(this, it); if (m) { this.story(m); continue } }
      if (it.kind === 'people' && !it.removable) { this.err('Tu ne peux supprimer qu’un objet sans grande importance pour autrui.'); continue }
      if (it.fixed && it.kind !== 'people' && !it.removable && !this.isRoot) { this.err('Voilà quelque chose que tu ne peux pas détruire.'); continue }
      const room = it.parent;
      if (!this.writable(room)) { this.err('(Permission non accordée)'); continue }
      room.remove(it);
      if (it.rmText) c.emit(typeof it.rmText === 'function' ? it.rmText(this) : it.rmText, 'story');
      else c.emit(`Tu viens de supprimer « ${it.name} ». Ses données disparaissent devant tes yeux.`, 'info');
      if (it.onRm) it.onRm(this, it, room);
    }
  }

  cmd_touch (args, c) {
    if (!args.length) return this.err('Tu dois indiquer ce que tu cherches à créer pour que cela marche.\nIl faut écrire : touch OBJET');
    for (const a of args) {
      const r = this.resolve(a);
      if (r.node) { c.emit(`« ${r.node.name} » existe déjà. Tu le touches : il a l'air comme neuf.`, 'dim'); continue }
      if (r.error || !r.parent) { this.notFound(r, a, 'dir'); continue }
      const room = r.parent.kind === 'link' ? r.parent.target : r.parent;
      if (!this.writable(room)) { this.err('Impossible de créer quelque chose ici. (Permission non accordée)'); continue }
      const it = new GNode('item', r.name, { text: `Ceci est un objet que tu as créé : ${r.name}. Il est encore tout neuf.` });
      const spec = this.world.touchables[r.name];
      if (spec) Object.assign(it, spec(this));
      room.add(it);
      c.emit(`Tu viens de créer : « ${r.name} » !`, 'info');
      for (const fn of this.world.events) fn(this, 'touch', it, room);
    }
  }

  cmd_mkdir (args, c) {
    if (!args.length) return this.err('Il faut écrire : mkdir CHEMIN');
    for (const a of args) {
      if (a.startsWith('-')) continue;
      const r = this.resolve(a);
      if (r.node) { this.err(`« ${r.node.name} » existe déjà.`); continue }
      if (r.error || !r.parent) { this.notFound(r, a, 'dir'); continue }
      const room = r.parent.kind === 'link' ? r.parent.target : r.parent;
      if (!this.writable(room)) { this.err('Impossible de créer un chemin ici. (Permission non accordée)'); continue }
      const nr = new GNode('room', r.name, { text: 'Un chemin tout neuf, que tu as créé toi-même. Il ne contient encore rien.', created: true });
      room.add(nr);
      c.emit(`Tu viens de créer un nouveau chemin : ${r.name}`, 'info');
      for (const fn of this.world.events) fn(this, 'mkdir', nr, room);
    }
  }

  cmd_unzip (args, c) {
    if (!args.length) return this.err('Il faut écrire : unzip SAC.zip');
    const it = this.getItem(args[0]); if (!it) return;
    if (!it.onUnzip) return this.err(`« ${it.name} » n'est pas une archive .zip : il n'y a rien à ouvrir.`);
    it.onUnzip(this, it, c);
  }

  cmd_grep (args, c) {
    if (!args.length) return this.err('Il faut écrire : grep MOT_MAGIQUE LÀ_OÙ_TU_CHERCHES');
    const opts = args.filter(a => /^-[a-z]+$/.test(a)).join('');
    const rest = args.filter(a => !/^-[a-z]+$/.test(a));
    const ic = opts.includes('i'); const cnt = opts.includes('c'); const num = opts.includes('n');
    const pat = rest[0];
    if (pat === undefined) return this.err('Il manque le mot à chercher.');
    const files = rest.slice(1);
    const match = (l) => ic ? l.toLowerCase().includes(pat.toLowerCase()) : l.includes(pat);
    const scan = (lines, prefix) => {
      let k = 0;
      lines.forEach((l, i) => { if (match(l)) { k++; if (!cnt) c.emit((prefix ? prefix + ':' : '') + (num ? (i + 1) + ':' : '') + l, 'grep') } });
      if (cnt) c.emit((prefix ? prefix + ':' : '') + k);
      return k;
    };
    if (!files.length) {
      if (!c.stdin) return this.err('Il faut écrire : grep MOT_MAGIQUE LÀ_OÙ_TU_CHERCHES\n(Ou bien envoyer du texte à grep avec un tube : less OBJET | grep MOT)');
      scan(c.stdin, '');
      return;
    }
    let total = 0;
    for (const f of files) {
      const r = this.resolve(f);
      if (r.error || !r.node) { this.notFound(r, f, 'item'); continue }
      const n = r.node;
      if (n.isDir) { this.err(`grep: ${f} : est un chemin (cherche dans les objets qu'il contient, par exemple : grep ${pat} ${f}/*)`); continue }
      if (n.protected && !this.isRoot) { this.err(`grep: ${f} : Permission non accordée`); continue }
      const text = n.grepText ? n.grepText(this, n) : n.getText(this);
      total += scan(text.split('\n'), files.length > 1 ? n.name : '');
      if (n.onGrep) n.onGrep(this, n, pat);
    }
    for (const fn of this.world.events) fn(this, 'grep', pat, files.map(f => this.resolve(f).node).filter(Boolean));
    if (!total && !cnt && !c.cap) c.emit('(Aucune ligne ne contient « ' + pat + ' ».)', 'dim');
  }

  cmd_sudo (args, c, seg) {
    if (!args.length) return this.err('Il faut écrire : sudo COMMANDE  (par exemple : sudo less OBJET)');
    if (args[0] === 'sudo') return this.err('Un seul sudo suffit !');
    this.pending = { type: 'password', seg: seg.slice(1), cap: c.cap, tries: 0 };
    this.out(`[sudo] Mot de passe de ${this.user} :`, 'prompt');
    return { pending: true };
  }

  finishSudo (p, pw) {
    if (pw !== this.password) {
      p.tries++;
      if (p.tries < 3) {
        this.err('Désolé, essaie de nouveau.');
        this.pending = p; this.out(`[sudo] Mot de passe de ${this.user} :`, 'prompt');
        return this.flush();
      }
      this.err('sudo : 3 saisies de mot de passe incorrectes.' + (this.hard ? '' : ' Le mot de passe est caché quelque part dans PlusDeFichiersNoyau…'));
      return this.flush();
    }
    if (!this.flags.sudoOk) { this.flags.sudoOk = true; if (this.world.onFirstSudo) this.world.onFirstSudo(this) }
    this.exec(p.seg, null, false, true);
    return this.flush();
  }


  // ---------- mode difficile ----------
  cmd_mode (args, c) {
    const a = (args[0] || '').toLowerCase();
    if (a === 'difficile') { this.hard = true; c.emit('Mode difficile activé : les aides qui donnent la solution sont retirées.', 'warn') }
    else if (a === 'normal') { this.hard = false; c.emit('Mode normal activé : toutes les aides sont de retour.', 'info') }
    else c.emit('Mode actuel : ' + (this.hard ? 'difficile' : 'normal') + '. (mode difficile / mode normal)', 'dim');
  }

  // ---------- codes de sauvegarde ----------
  // Le code mémorise les étapes clés de l'aventure (pas les objets créés pour s'entraîner).
  staticRooms () {
    if (!this._rooms) { const l = []; const walk = (n) => { if (n.kind === 'room') { l.push(n); n.children.forEach(walk) } }; walk(this.root); this._rooms = l }
    return this._rooms;
  }
  saveCode () {
    const M = this.world.milestones;
    const rooms = this.staticRooms();
    let r = this.cwd; while (r && !rooms.includes(r)) r = r.parent;
    const fields = [[1, 2]]; // version
    for (const m of M) fields.push([m.test(this) ? 1 : 0, 1]);
    fields.push([this.hard ? 1 : 0, 1], [Math.max(0, rooms.indexOf(r)), 7], [Math.min(this.cmdCount, 4095), 12]);
    let v = 0n;
    for (const [val, bits] of fields) v = (v << BigInt(bits)) | BigInt(val);
    v = (v << 8n) | BigInt(this.checksum(v));
    let s = '';
    for (let i = 0; i < 13; i++) { s = B32[Number(v & 31n)] + s; v >>= 5n }
    return s.slice(0, 4) + '-' + s.slice(4, 8) + '-' + s.slice(8);
  }
  checksum (v) { let h = 0x5a; while (v > 0n) { h = ((h * 31) + Number(v & 255n)) % 251; v >>= 8n } return h }
  decodeCode (code) {
    const s = code.toUpperCase().replace(/[\s-]/g, '').replace(/O/g, '0').replace(/[IL]/g, '1').replace(/U/g, 'V');
    if (s.length !== 13) return null;
    let v = 0n;
    for (const ch of s) { const k = B32.indexOf(ch); if (k < 0) return null; v = (v << 5n) | BigInt(k) }
    const chk = Number(v & 255n); v >>= 8n;
    if (this.checksum(v) !== chk) return null;
    const M = this.world.milestones;
    const take = (bits) => { const x = Number(v & ((1n << BigInt(bits)) - 1n)); v >>= BigInt(bits); return x };
    const count = take(12); const room = take(7); const hard = take(1);
    const ms = []; for (let i = M.length - 1; i >= 0; i--) ms[i] = take(1);
    if (take(2) !== 1) return null;
    return { count, room, hard: !!hard, ms };
  }
  findPath (path) { // ignore les passages cachés ou fermés
    let n = this.root;
    for (const p of path.split('/').filter(Boolean)) { n = n.children.find(c => c.name === p); if (!n) return null; if (n.kind === 'link') n = n.target }
    return n;
  }
  loadCode (code) {
    const d = this.decodeCode(code);
    if (!d) return false;
    const ui = this.ui; this.ui = {};
    this.reset();
    const M = this.world.milestones;
    try {
      M.forEach((m, i) => {
        if (!d.ms[i]) return;
        for (const st of m.steps) {
          if (typeof st === 'function') { st(this); continue }
          const room = this.findPath(st[0]); if (room) this.cwd = room;
          const line = typeof st[1] === 'function' ? st[1](this) : st[1];
          this.input(line);
        }
      });
    } finally { this.ui = ui }
    this.buf = []; this.hist = []; this.pending = null;
    this.hard = d.hard; this.cmdCount = d.count;
    const rooms = this.staticRooms();
    this.cwd = rooms[d.room] || this.home; this.prevDir = this.cwd;
    return true;
  }
  cmd_sauver (a, c) {
    c.emit('Ton code de sauvegarde :', 'info');
    c.emit('    ' + this.saveCode(), 'code');
    c.emit("Note-le précieusement ! Pour reprendre ta partie, sur n'importe quel ordinateur, tape :\n    charger " + this.saveCode() + "\n(Le code retient tes sorts, tes quêtes et l'endroit où tu te trouves, mais pas les objets que tu as créés pour t'entraîner.)", 'dim');
  }
  cmd_charger (args, c) {
    if (!args.length) return this.err('Il faut écrire : charger CODE   (par exemple : charger 1A2B-3C4D-5E6F7)');
    const code = args.join('');
    if (!this.decodeCode(code)) return this.err('Ce code de sauvegarde est invalide. Vérifie chaque caractère (le code a 13 caractères, sans compter les tirets).');
    this.loadCode(code);
    if (this.ui.loaded) this.ui.loaded(code);
    this.out('Partie chargée ! Tu te trouves dans ' + (this.cwd.name || 'la Racine') + '.', 'learn');
    this.out(this.describeRoom(this.cwd), 'story');
  }

  // ---------- complétion ----------
  complete (line) {
    const m = line.match(/^(.*?)([^\s|]*)$/);
    const before = m[1]; const word = m[2];
    const words = before.trim().split(/\s+/).filter(Boolean);
    const lastSeg = before.split('|').pop().trim();
    const isCmd = lastSeg === '' || (lastSeg === 'sudo');
    let cands = [];
    if (isCmd) {
      cands = [...this.learned].filter(k => k.startsWith(word) && !HIDDEN_CMDS.includes(k));
      if (this.learned.has('sudo')) cands = cands.concat(['whoami'].filter(k => k.startsWith(word) && !cands.includes(k)));
      cands = cands.map(k => k + ' ');
    } else {
      const i = word.lastIndexOf('/');
      const dirPart = i >= 0 ? word.slice(0, i + 1) : '';
      const base = i >= 0 ? word.slice(i + 1) : word;
      const r = dirPart ? this.resolve(dirPart === '/' ? '/' : dirPart.replace(/\/$/, '')) : { node: this.cwd };
      if (!r.node || !r.node.isDir || r.error) return { line, options: [] };
      const cmd = lastSeg.split(/\s+/)[0] === 'sudo' ? lastSeg.split(/\s+/)[1] : lastSeg.split(/\s+/)[0];
      const dirOnly = cmd === 'cd';
      let pool = r.node.visible();
      if (dirOnly) pool = pool.filter(x => x.isDir);
      const extra = base.startsWith('.') ? ['..'] : [];
      cands = pool.map(x => x.name).concat(extra).filter(nm => nm.startsWith(base))
        .map(nm => { const n = r.node.child(nm); return dirPart + nm + ((n && n.isDir) || nm === '..' ? '/' : ' ') });
      if (!cands.length) {
        const nb = norm(base);
        cands = pool.map(x => x.name).filter(nm => norm(nm).startsWith(nb)).map(nm => { const n = r.node.child(nm); return dirPart + nm + (n && n.isDir ? '/' : ' ') });
      }
    }
    if (!cands.length) return { line, options: [] };
    if (cands.length === 1) return { line: before + cands[0], options: [] };
    let pre = cands[0];
    for (const cnd of cands) { let k = 0; while (k < pre.length && k < cnd.length && pre[k] === cnd[k]) k++; pre = pre.slice(0, k) }
    return { line: before + (pre.length > word.length ? pre : word), options: cands.map(s => s.trim().replace(/^.*\/(?=.)/, '')) };
  }
}

      return "L'Artisane lève ses lunettes et te regarde avec surprise.\n« Êtes-vous le nouvel assistant ? Vous êtes en retard ! »…\n« Vous dites que vous n'êtes pas mon assistant ? Eh bien, cela ne signifie pas que vous ne pouvez pas vous rendre utile.\nJ'ai besoin de rouages, vite !\n… Vous ne savez même pas comment fabriquer des rouages ? Hum. Et vous prétendez être un assistant.\nDites simplement « touch » suivi du nom de la chose que vous voulez créer. Maintenant, faites-moi un rouage ! Vous reviendrez me parler après. »";
    },
    onLess: (g) => { g.learn('touch'); if (g.flags.gearTouched) g.learn('cp') }

  const artisanshop = R('BoutiqueArtisanale', { img: 'artisanshop', text: "Les murs de la boutique sont couverts d'horloges dont les tic-tac sont légèrement désynchronisés.\nDevant le plan de travail, une femme avec une grosse paire de lunettes brandit un chalumeau avec un enthousiasme inquiétant." },
    I('Dragon', "Un dragon de deux mètres de long parcourt la pièce.\nTu aurais cru qu'il s'agissait d'un vrai dragon s'il n'avait pas sur le dos une clef pour remonter son mécanisme.", { img: 'clockdragon', fixed: 'Il a dû falloir de nombreuses semaines pour réaliser ce Dragon mécanique. N\'as-tu donc aucun respect ?', onRmTry: () => 'Où est-ce que tu te crois ? Dans « Donjons et Dragons » ?' }),
    I('BabioleÉtrange', 'Ça ressemble à une roche de cristal.', { img: 'trinket', fixed: 'Cette babiole a sûrement une grande valeur pour cette femme ! En a-t-elle pour toi ?', onRmTry: () => 'T\'a-t-on déjà expliqué que certains objets ont plus de valeur pour une personne que pour une autre ? On appelle cela la valeur sentimentale.' }),

  // --- marché ---
  const market = R('PlaceDuMarché', { img: 'market', text: 'Les commerces sont alignés et forment une longue ligne droite.' });
  const purse = (name, val) => I(name, `Une bourse bien remplie : ${val} pièces d'or.`, { onRmTry: () => 'Mieux vaut ne pas détruire ça : tu pourrais en avoir besoin.', img: null, purse: val });
  const backpack = I('SacADos', null, {
    img: 'backpack', onRmTry: () => 'Mieux vaut ne pas détruire ça : tu pourrais en avoir besoin.', 
    text: (g, n) => n.emptied ? 'Le sac à dos est vide.' : "Il y a sur la table un sac à dos avec une ouverture zippée super classe, sans prix dessus. Sa toile est un peu effilochée mais il semble robuste.\nTu jettes un coup d'œil au vendeur, mais son attention est ailleurs.\nUne inscription apparaît près de la languette du sac : « unzip ».",
    onLess: (g, n) => { g.learn('unzip'); if (!n.emptied && n.name === 'SacADos') { n.name = 'SacADos.zip'; g.out('(Le sac s\'appelle désormais « SacADos.zip ».)', 'dim') } },

  const rmSpell = I('rm', "« Ah, oui, le sort « rm », » songe le vendeur.\n« Dis juste « rm » suivi du nom de l'objet, et cela causera sa disparition… pour toujours.\nAs-tu les tripes pour l'utiliser ? »", { img: 'manuscript', fixed: 'Ce sort est à vendre, pas à emporter !' });

  const findPurse = (val) => { const all = []; const walk = (n) => { n.children.forEach(c => { if (c.purse === val) all.push(c); walk(c) }) }; walk(g.root); return all.find(p => p.parent === market) || all[0] || null };
  const vendor = P('Vendeur', "« Bonjour ! » Le vendeur te sourit de manière déplaisante.\n« Que souhaites-tu acheter ? »", {

  // --- chemin en pierres et ferme ---

      img: 'bigboulder', fixed: 'Il est bien trop gros pour être déplacé.', removable: true,

  // --- pont, clairière, cave des trolls ---
  const kernelLink = L('FichiersNoyau', { text: 'Un passage qui descend très profondément.' });

    img: 'chasm',
    text: 'Tu te laisses glisser le long du toboggan… Au bout, tu aperçois une autre pièce, tout au fond de la Racine du monde.\n(Regarde avec ls.)',
    cdBlock: (g) => troll1.parent ? "C'est juste un toboggan. Tu ne sais pas si tu pourras remonter, mais tu sais que tu dois y aller.\nCependant, le TrollMoche te bloque le passage." : null,
    lsBlock: (g) => troll1.parent ? 'Le TrollMoche est assis devant, tu ne vois rien.' : null,
    onEnter: (g) => { g.flags.kernelOpen = true }
  }, kernelLink);
  const troll1 = P('TrollMoche', 'Il a l\'air fou, et vraiment très moche.\nIl est assis juste devant l\'entrée du Toboggan.', {
    img: 'troll1', removable: true,
    rmText: 'Le troll semble surpris, puis il disparaît dans un bruit désagréable.\nL\'entrée du Toboggan est maintenant libre !',
    onRm: () => {},
    onMvTry: (g, n) => { n.parent.remove(n); return 'Tu pousses le TrollMoche hors de la cave. Il dévale le CheminInquiétant en grognant et disparaît.\nL\'entrée du Toboggan est maintenant libre !' },
    onCpTry: () => 'Ils se multiplient !… Non, finalement, une seule copie de cette tête-là, c\'est déjà trop.'
  });
  const troll2 = P('TrollPlusMoche', "Il a l'air fou et vraiment, vraiment moche.\nMais il veut te dire quelque chose. Entre deux grognements incompréhensibles, tu parviens à discerner les mots suivants :\n« Tu peux jeter des sorts sur les objets que tu ne vois pas actuellement. Par exemple, si tu veux déplacer un objet\nqui se trouve dans la Cage vers le CheminInquiétant d'où tu viens, tu peux faire :\n  mv Cage/OBJET ..\nTu peux faire cela pour la plupart des sorts et la plupart des salles.\nUtilise cette connaissance avec prudence. Souviens-toi… on ne peut pas annuler un sort « rm ». »", {
    img: 'troll2', onRmTry: () => '« Hé ! Je t\'aidais, moi ! » Le TrollPlusMoche esquive ton sort en ricanant.', fixed: 'Il est bien trop lourd. Et il sent vraiment trop fort pour que tu t\'en approches.'
  });
  const supertroll = P('TrollAbsolumentHideux', 'Tu ne veux sûrement pas regarder cet individu. Oups, trop tard.\nIl monte la garde devant la Cage.', {
    img: 'supertroll', removable: true,
    onRmTry: (g) => g.isRoot ? null : "Le troll émet un rot spectaculaire, puis un sourire narquois.\nTu ne pourras pas te débarrasser de lui facilement, pas sans le « mot de passe sudo ». Ce n'est pas « pseudo », c'est « sudo » !\nTu peux le trouver dans les FichiersNoyau." + (troll1.parent ? '\nMais d\'abord, tu dois te débarrasser du TrollMoche.' : ''),
    onMvTry: () => 'Si tu le fais sortir de la grotte, il ira semer la terreur dans le pays. Il voudra aussi probablement te manger.',
    rmText: 'Avec toute la puissance de sudo, tu prononces le sort.\nLe TrollAbsolumentHideux pousse un hurlement… et se dissout en un petit nuage de fumée verte.\nLa Cage n\'est plus gardée !',
    onRm: (g) => g.quest('troll')
  });
  const clearing = R('Clairière', {
    img: 'clearing',
    text: (g) => "C'est une clairière couverte d'herbe, avec un homme assis sur un rocher, soupirant…\n" + (g.quests.maison ? 'Derrière lui, une belle Maison neuve.' : 'Derrière lui, les ruines d\'une maison.'),
    cdBlock: (g) => g.flags.plank ? null : 'Tu ne peux pas traverser le pont tant que tu n\'as pas remplacé la Planche manquante.'
  });

      if (n.freed) return 'Elle est libre, maintenant : elle va où elle veut !';

      n.freed = true; n.parent.remove(n); n.name = 'Enfant'; n.text = '« Merci de m\'avoir sauvée ! Tu sais, je n\'avais même pas peur. Enfin… un peu. »'; clearing.add(n); g.quest('enfant');
      return "L'enfant regarde autour d'elle, confuse, surprise de se trouver hors de la cage.\nTu lui souris et lui dis d'une voix douce : « Tu devrais rentrer chez toi, p'tit gars. »\n« Je suis une fille avec des cheveux courts. Pas un garçon manqué. Une fille ! Pourquoi faudrait-il toujours être un garçon par défaut ? » dit la petite fille.\nElle file en courant vers la Clairière, où l'attend son père.";

  const trollcave = R('CaveDesTrolls', { hidden: true, img: 'cave', text: (g) => "La cave est sombre et elle sent… les pieds ?! Ah, d'accord, ce sont probablement les trolls.\n" + (kid.parent === cage ? 'Contre le mur du fond, un enfant enfermé dans une Cage a l\'air effrayé.' : 'Contre le mur du fond, la Cage est désormais vide.') }, troll1, troll2, supertroll, cage, slide);
  const ominous = R('CheminInquiétant', { img: 'path', text: "Ce chemin mène vers une cave très sombre.\nC'est un chemin pavé tout à fait ordinaire, et pourtant, passer par ici te fiche la trouille." },
    I('RoncesTordues', "Ce tas de ronces est couvert d'épines qui ne t'inspirent vraiment pas confiance.\nTu ne peux pas le contourner, et tu n'essaieras sûrement pas de le traverser.\nPourtant, quelque chose te dit que derrière ce tas de ronces se trouve quelque chose d'important.", {

  const cryingman = P('HommeEnPleurs', null, {

      if (g.quests.maison) return "« Merci du fond du cœur de m'avoir construit cette Maison ! J'en pleure de joie.\nY a-t-il beaucoup d'autres personnes comme toi ?\nEs-tu capable de libérer mon enfant ? Les trolls l'ont emmenée au bout du CheminInquiétant.\nDésolé, je t'en demande beaucoup trop, mais tu es mon seul espoir de retrouver ma famille. »";
      return `« Vous ! Vous faites partie des mercenaires de ${DW} ! Je la sens, cette capacité étrange que vous avez.\nVous êtes là pour finir le travail, n'est-ce pas ? Allez ! Qu'est-ce que vous attendez ? Il ne me reste plus rien à perdre. »\n— Mais enfin ! Que s'est-il passé ?\n« Ce qui est arrivé ? Vous OSEZ le demander ? Vos copains sont venus il y a deux jours. Ils ont détruit ma maison et enlevé mon pauvre enfant.\nMa femme est partie en ville chercher de l'aide, mais depuis, elle n'est pas revenue. »\n— C'est affreux. Que puis-je faire pour vous venir en aide ?\n« Comment ? D'accord, j'imagine que vous n'avez rien à voir avec tout ça. Vous ne ressemblez pas aux soldats de ${DW}.\nCela dit, je n'ai pas confiance en vous.\nSi vous êtes vraiment bien intentionné·e, alors prouvez-le en me construisant une nouvelle Maison ! »`;
    }

  clearing.add(cryingman, ominous);

  // --- place du village ---

      return cycle(['« Hmmm. Des questions ? Vas-y. »', '« Hmmm. Si tu as besoin d\'équipement, je te conseille la PlaceDuMarché et la BoutiqueArtisanale. »', '« Hmmm. Si tu as besoin d\'informations, je te conseille la Bibliothèque. »'], { loop: true })(g, n);
    },
    onLess: (g, n) => { if (!n.named) { n.named = true; n.name = 'Jasper'; g.out('(Le Villageois s\'appelle désormais « Jasper ».)', 'dim') } }
  });
  const citizen2 = P('VieuxLecteur', `Ce villageois lit le journal quand il remarque que tu le regardes.\n« As-tu lu ça ? » s'esclaffe-t-il, en secouant la dernière édition du « Dernier Mot » devant ton visage.\n« Ça dit que le terrible ${DW} a répandu la corruption d'Oseton jusqu'au Sud, et que Konsole est déjà atteint ! Les temps sont dangereux. »\nIl marmonne, secoue la tête et retourne à sa lecture.`, { img: 'citizen2' });
  const citizen3 = P('VillageoiseEnPleurs', null, {
    img: 'lady',
    text: (g, n) => {

      return cycle(["La villageoise pleure et tremble sans pouvoir s'arrêter.\n« Mon bébé ! » pleure-t-elle. « Ils ont enlevé mon bébé ! Je sais que le magicien en est responsable. »",
        `« Mon bébé… Je vais lancer « pkill -9 ${DW} » ! »`, '(Tu ne sais pas quoi dire…)', '(Tu as beau réfléchir, la seule chose qui soulagerait cette maman serait de retrouver son enfant.)', '« Je vais « rm » ces trolls ! »', '« Mais… qui a le pouvoir de faire ça ? Toi ? »'])(g, n);
    }
  });
  const townsquare = R('PlaceDuVillage', {

  }, citizen1, citizen2, citizen3, artisanshop, bridge, library, market, rockypath);

  // ============ CHAPITRE 3 : les FichiersNoyau (fin réparée) ============
  const PASSWORD = 'sesame';
  const filler = [
    'Alice, assise auprès de sa sœur sur le gazon, commençait à s\'ennuyer de rester là à ne rien faire ;',
    'une ou deux fois, elle avait jeté les yeux sur le livre que lisait sa sœur ;',
    'mais quoi ! pas d\'images, pas de dialogues ! « La belle avance, » pensait Alice, « qu\'un livre sans images, sans causeries ! »',
    'Le Lapin Blanc passa en courant, tira une montre de son gousset, la regarda, puis reprit sa course.',

    'Un processus s\'endort, un autre se réveille ; personne ne s\'en aperçoit.',
    'Le passage du temps se mesure ici en cycles d\'horloge, pas en minutes.',
    'Sur la page suivante, une longue liste de nombres sans aucun intérêt.',
    'Il faudrait des heures pour tout lire. Peut-être existe-t-il un sort pour chercher plus vite ?',
    'Un vieux journal système raconte qu\'un passager clandestin s\'est caché dans la mémoire tampon.',
    'Rien à signaler. Rien à signaler. Rien à signaler.',
    'La reine de cœur cria : « Qu\'on lui coupe la tête ! » mais personne ne bougea.',
    'Le noyau surveille tout : les fichiers, les processus, les utilisateurs et leurs passwords oubliés.',
    'Dans un coin, quelqu\'un a griffonné : « grep est ton ami ».',
    'Les chemins se croisent, se séparent, puis se rejoignent à la Racine.',
    'Il était une fois un bit qui rêvait de devenir un octet.',
    'Ce texte contient des millions de mots. Cela prendrait des heures de tout lire.'
  ];
  const letters = 'LMPQRSTUVW'.split('');
  const secretIn = 'S';
  const bigFiles = letters.map((L, k) => {
    const lines = [];
    for (let i = 0; i < 120; i++) lines.push(filler[(i * 7 + k * 5 + (i >> 2)) % filler.length]);
    if (L === secretIn) lines.splice(87, 0, 'Note pour l\'Admin, à ne surtout pas oublier : password=' + PASSWORD);
    const full = lines.join('\n');
    return I(L + '.txt', full, {
      lessView: () => lines.slice(0, 10).join('\n') + `\n[… encore ${lines.length - 10} lignes. Ce texte contient des millions de mots : cela prendrait des heures de tout lire.]`
    });
  });
  const morekernel = R('PlusDeFichiersNoyau', { img: 'cluster', writable: false, text: 'Il y a tant de fichiers dans cette salle !' }, ...bigFiles);
  const certificate = I('Certificat', null, {
    img: 'locker', protected: true,
    protectedMsg: (g) => g.hard ? 'Le Certificat est protégé par un sort puissant.' : 'Tu dois lire le Certificat avec le mot de passe sudo : sudo less Certificat',
    text: (g) => finalText(g),
    onLess: (g) => { if (g.isRoot && !g.flags.won) { g.flags.won = true; if (g.ui.end) g.ui.end() } },

(function () {
  const KEY = 'terminus-fr-corrige-v2';
  const $ = (id) => document.getElementById(id);
  const out = $('out'), inp = $('in'), ps = $('ps');
  let muted = false, log = [], base = null, skipLog = false, game, hpos = -1, draft = '';

  const store = {
    load () { try { return JSON.parse(localStorage.getItem(KEY) || 'null') || { base: null, log: [] } } catch (e) { return { base: null, log: [] } } },
    save () { try { localStorage.setItem(KEY, JSON.stringify({ base, log })) } catch (e) {} },
    clear () { try { localStorage.removeItem(KEY) } catch (e) {} }
  };

  function setRoomImg (k) { const src = k && ASSETS.loc[k]; $('room').src = src || ASSETS.loc.stair; }
  function showSprite (k) { const s = $('sprite'); if (k && ASSETS.item[k]) { s.src = ASSETS.item[k]; s.classList.add('on') } else s.classList.remove('on') }
  function shortPrompt () {
    let p = game.prompt();
    const max = window.innerWidth < 760 ? 22 : 48;
    if (p.length <= max) return p;
    const m = p.match(/^(.*?:)(.*)\$$/); const parts = m[2].split('/');
    return '…/' + parts.slice(-1)[0] + '$';
  }
  function refreshScene () {
    let n = game.cwd; let img = null;
    for (let x = n; x && !img; x = x.parent) img = x.img; // pièce sans image : on garde celle du parent
    if (!muted) { setRoomImg(img); }
    $('place').textContent = game.cwd.name || 'Racine';
    $('path').textContent = game.cwd.path();
    ps.textContent = shortPrompt();
  }

  const ui = {
    image: () => { if (!muted) showSprite(null) },

    end: () => { if (!muted) setTimeout(() => $('end').classList.add('on'), 400) },
    restart: () => { store.clear(); log = []; base = null; start(true) },

  };

  function print (t, cls) {

  }

  function intro (resumed) {

    print('Déjà une partie en cours sur un autre ordinateur ? Tape « charger » suivi de ton code de sauvegarde.', 'dim');
    print('\n. . .\nTu m\'as l\'air de ne pas y voir grand-chose dans ce brouillard.\nPerdu·e ? Il n\'y a pas de carte qui puisse décrire ce monde.\n', 'story');
    print('1. En écrivant « ls » (LiSter), tu pourras voir ce qui croise ton chemin ;\n2. En écrivant « cd » suivi d\'un chemin (Changer de Dossier), tu pourras aller ailleurs ;\n3. En écrivant « less » suivi d\'un nom, tu pourras examiner un objet ou parler à quelqu\'un ;\n4. En écrivant « pwd », tu sauras où tu es ;\n5. En écrivant « help », une aide apparaîtra.', 'info');

  }

    if (skipLog) skipLog = false;
    else if (!/^\s*reset\s*$/.test(line) && !(pending && pending.type === 'confirm')) { log.push(line); store.save() }
    if (game.cwd !== before) showSprite(null);
    printAll(res);
    refreshScene();
    setPwMode();
  }

  $('inrow').addEventListener('submit', (e) => {
    e.preventDefault();
    const line = inp.value; inp.value = ''; hpos = -1;
    submit(line);
  });

  function doTab () {
    if (game.pending) return;
    game.flags.usedTab = true;
    const r = game.complete(inp.value);
    inp.value = r.line;
    if (r.options.length > 1) { print(r.options.join('    '), 'dim'); out.scrollTop = out.scrollHeight }
  }
  function histMove (dir) {
    const h = game.hist; if (!h.length) return;
    if (hpos === -1) { if (dir > 0) return; draft = inp.value; hpos = h.length }
    hpos += dir;
    if (hpos < 0) hpos = 0;
    if (hpos >= h.length) { hpos = -1; inp.value = draft; return }
    inp.value = h[hpos];
    setTimeout(() => inp.setSelectionRange(inp.value.length, inp.value.length));
  }

  inp.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') { e.preventDefault(); doTab() }
    else if (e.key === 'ArrowUp') { e.preventDefault(); histMove(-1) }
    else if (e.key === 'ArrowDown') { e.preventDefault(); histMove(1) }
    else if (e.ctrlKey && (e.key === 'l' || e.key === 'L')) { e.preventDefault(); out.innerHTML = '' }
    else if (e.ctrlKey && (e.key === 'u' || e.key === 'U')) { e.preventDefault(); inp.value = inp.value.slice(inp.selectionStart) }
    else if (e.ctrlKey && (e.key === 'c' || e.key === 'C') && !window.getSelection().toString()) {
      e.preventDefault();
      const d = document.createElement('div'); d.className = 'cmd'; d.textContent = (game.pending ? '' : game.prompt() + ' ') + inp.value + '^C'; out.appendChild(d);
      inp.value = ''; game.pending = null; setPwMode(); out.scrollTop = out.scrollHeight;
    }
  });
  $('keys').addEventListener('click', (e) => {
    const k = e.target.dataset && e.target.dataset.k; if (!k) return;
    if (k === 'tab') doTab(); else if (k === 'up') histMove(-1); else if (k === 'down') histMove(1); else if (k === 'ls') { inp.value = 'ls'; submit('ls'); inp.value = '' }
    inp.focus();
  });
  $('btnHelp').addEventListener('click', () => { submit('help'); inp.focus() });
  $('btnSave').addEventListener('click', () => { submit('sauver'); inp.focus() });
  $('term').addEventListener('mouseup', () => { if (!window.getSelection().toString()) inp.focus() });
  $('endclose').addEventListener('click', () => { $('end').classList.remove('on'); inp.focus() });
  $('endimg').src = ASSETS.loc.theend;

  start(false);
  inp.focus();
})();
</script>
</body>
</html>
